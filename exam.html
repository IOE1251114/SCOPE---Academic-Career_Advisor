<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope | Examinations Database</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <style>
        /* Database & Hero Specific Styling */
        body {
            background-color: black;
            color: white;
            font-family: Arial Black, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .db-header {
            padding: 15px 40px;
            background-color: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #4B5DE4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            background-image: url('images/scope.png');
            background-size: contain;
            background-repeat: no-repeat;
            width: 150px;
            height: 40px;
            display: flex;
            align-content: center;
        }

        .nav-link {
            color: #00E5FF;
            text-decoration: none;
            font-size: 14px;
            font-family: Arial Black, Helvetica, sans-serif;
            border: 2px solid #00E5FF;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: #00E5FF;
            color: black;
        }

        /* Hero Section */
        .db-hero {
            margin: 0;
            display: flex;
            flex-direction: column;
            background-image: url('images/back.png');
            background-size: cover;
            background-position: center;
            height: 300px;
            width: 100%;
            text-shadow: 0 0 25px black;
            font-size: 28px;
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .name {
            font-family: Arial Black, Helvetica, sans-serif;
            background: linear-gradient(to bottom, #00E5FF, #29CBE3, #4B5DE4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            font-size: 35px;
            text-shadow: none;
            margin-top: 10px;
        }

        /* Dashboard Layout */
        .dashboard {
            display: flex;
            gap: 25px;
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            width: 320px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 3px solid #4B5DE4;
            border-radius: 10px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 {
            color: #00E5FF;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 1px solid #4B5DE4;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .filter-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
        }

        .filter-group select, 
        .filter-group input[type="text"], 
        button#apply-exam-filters-btn {
            width: 100%;
            border: 2px solid #4B5DE4;
            background-color: black;
            color: white;
            border-radius: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            height: 40px;
            padding: 0 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .filter-group select:hover, 
        .filter-group input[type="text"]:focus, 
        button#apply-exam-filters-btn:hover {
            border-color: #00E5FF;
            outline: none;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .filter-group select {
            font-family: Arial Black, Helvetica, sans-serif;
        }

        button#apply-exam-filters-btn {
            margin-top: 10px;
            background-color: #4B5DE4;
            font-family: Arial Black, Helvetica, sans-serif;
        }

        button#apply-exam-filters-btn:hover {
            background-color: #00E5FF;
            color: black;
        }

        .results-area {
            flex-grow: 1;
        }

        #exam-results-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Card Styling */
        .college-card {
            background-color: rgba(0, 0, 0, 0.6);
            border: 3px solid #4B5DE4;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .college-card:hover {
            border-color: #00E5FF;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .college-card h3 {
            color: white;
            font-size: 18px;
            margin: 12px 0;
            line-height: 1.3;
        }

        .badge {
            align-self: flex-start;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
        }

        .badge-univ { background-color: #4B5DE4; color: white; }
        .badge-coll { background-color: #00E5FF; color: black; }

        .card-details p {
            font-size: 12px;
            color: #aaa;
            margin: 6px 0;
            font-family: Arial, sans-serif;
        }

        .website-link {
            margin-top: auto;
            padding-top: 15px;
            color: #00E5FF;
            text-decoration: none;
            font-size: 13px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .website-link:hover {
            color: white;
            text-decoration: underline;
        }

        .no-website {
            margin-top: auto;
            padding-top: 15px;
            color: #666;
            font-size: 12px;
            font-style: italic;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header with Logo -->
    <header class="db-header">
        <div class="logo"></div>
        <a href="index.html" class="nav-link">← Back to Home</a>
    </header>

    <!-- Hero Section Banner -->
    <section class="db-hero">
        Find Institutions Accepting Your Target Exams with
        <div class="name">SCOPE EXAMS</div>
    </section>

    <!-- Main Dashboard Body -->
    <div class="dashboard">
        <!-- Search Filter Sidebar -->
        <aside class="sidebar">
            <h2>Find by Exam</h2>
            
            <div class="filter-group">
                <label>Select Exam</label>
                <select id="exam-search-input">
                    <option value="">-- Choose an exam --</option>
                    <optgroup label="Undergraduate (UG)">
                        <option value="JEE Main" data-cat="ug">JEE Main (B.E. / B.Tech)</option>
                        <option value="JEE Advanced" data-cat="ug">JEE Advanced (IITs)</option>
                        <option value="NEET UG" data-cat="ug">NEET UG (MBBS / BDS / AYUSH)</option>
                        <option value="CUET UG" data-cat="ug">CUET UG</option>
                        <option value="CLAT" data-cat="ug">CLAT (LLB)</option>
                        <option value="NCET" data-cat="ug">NCET (ITEP)</option>
                        <option value="NATA" data-cat="ug">NATA (B.Arch)</option>
                        <option value="BITSAT" data-cat="ug">BITSAT</option>
                        <option value="VITEEE" data-cat="ug">VITEEE</option>
                        <option value="IPMAT" data-cat="ug">IPMAT</option>
                        <option value="NIFT" data-cat="ug">NIFT</option>
                        <option value="MHT CET" data-cat="ug">MHT CET</option>
                        <option value="KCET" data-cat="ug">KCET</option>
                        <option value="EAPCET" data-cat="ug">AP / TS EAPCET</option>
                        <option value="WBJEE" data-cat="ug">WBJEE</option>
                        <option value="OJEE" data-cat="ug">OJEE</option>
                        <option value="GUJCET" data-cat="ug">GUJCET</option>
                        <option value="KEAM" data-cat="ug">KEAM</option>
                        <option value="COMEDK" data-cat="ug">COMEDK</option>
                        <option value="BCECE" data-cat="ug">BCECE</option>
                        <option value="ICAR" data-cat="ug">ICAR AIEEA UG (Agriculture)</option>
                        <option value="D.El.Ed" data-cat="ug">D.El.Ed</option>
                        <option value="GNM" data-cat="ug">GNM / ANM (Nursing)</option>
                        <option value="B.Sc Nursing" data-cat="ug">B.Sc Nursing</option>
                        <option value="D.Pharm" data-cat="ug">D.Pharm</option>
                        <option value="B.Pharm" data-cat="ug">B.Pharm</option>
                        <option value="NCHM" data-cat="ug">NCHM JEE (Hotel Management)</option>
                        <option value="Class 12 merit" data-cat="ug">Class 12 merit (no entrance)</option>
                        <option value="own entrance" data-cat="ug">University's own entrance test</option>
                    </optgroup>
                    <optgroup label="Postgraduate (PG)">
                        <option value="GATE" data-cat="pg">GATE (M.Tech)</option>
                        <option value="CAT" data-cat="pg">CAT (MBA)</option>
                        <option value="MAT" data-cat="pg">MAT (MBA)</option>
                        <option value="CMAT" data-cat="pg">CMAT (MBA)</option>
                        <option value="XAT" data-cat="pg">XAT (MBA)</option>
                        <option value="SNAP" data-cat="pg">SNAP (MBA)</option>
                        <option value="GMAT" data-cat="pg">GMAT</option>
                        <option value="NEET PG" data-cat="pg">NEET PG (MD / MS)</option>
                        <option value="CUET PG" data-cat="pg">CUET PG</option>
                        <option value="CLAT PG" data-cat="pg">CLAT PG (LLM)</option>
                        <option value="GPAT" data-cat="pg">GPAT (M.Pharm)</option>
                        <option value="AIAPGET" data-cat="pg">AIAPGET (AYUSH PG)</option>
                        <option value="ICAR" data-cat="pg">ICAR AIEEA PG</option>
                        <option value="UGC NET" data-cat="pg">UGC NET</option>
                        <option value="CSIR" data-cat="pg">CSIR NET</option>
                        <option value="JAM" data-cat="pg">IIT JAM</option>
                        <option value="NIMCET" data-cat="pg">NIMCET (MCA)</option>
                        <option value="MCA" data-cat="pg">MCA entrance</option>
                        <option value="M.Ed" data-cat="pg">M.Ed</option>
                        <option value="LLM" data-cat="pg">LLM</option>
                        <option value="TANCET" data-cat="pg">TANCET</option>
                        <option value="PGCET" data-cat="pg">PGCET</option>
                        <option value="MAH" data-cat="pg">MAH CET (MBA / MMS)</option>
                        <option value="CEED" data-cat="pg">CEED (Design)</option>
                        <option value="Degree merit" data-cat="pg">Degree merit (MA / M.Sc / M.Com)</option>
                        <option value="own entrance" data-cat="pg">University's own entrance test</option>
                    </optgroup>
                </select>
            </div>

            <div class="filter-group">
                <label>Search Institution by Name</label>
                <input type="text" id="exam-name-search" placeholder="e.g. Delhi University">
            </div>

            <div class="filter-group">
                <label>Institution Level</label>
                <select id="exam-inst-level">
                    <option value="all">Universities & Colleges</option>
                    <option value="university">Universities Only</option>
                    <option value="college">Colleges Only</option>
                </select>
            </div>

            <div class="filter-group">
                <label>State Filter</label>
                <select id="exam-state-filter">
                    <option value="all">All States & UTs</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                    <option value="Assam">Assam</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Chhattisgarh">Chhattisgarh</option>
                    <option value="Goa">Goa</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Manipur">Manipur</option>
                    <option value="Meghalaya">Meghalaya</option>
                    <option value="Mizoram">Mizoram</option>
                    <option value="Nagaland">Nagaland</option>
                    <option value="Odisha">Odisha</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Sikkim">Sikkim</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Tripura">Tripura</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttarakhand">Uttarakhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                    <option value="Chandigarh">Chandigarh</option>
                    <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra & Nagar Haveli and Daman & Diu</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                    <option value="Ladakh">Ladakh</option>
                    <option value="Lakshadweep">Lakshadweep</option>
                    <option value="Puducherry">Puducherry</option>
                </select>
            </div>

            <div class="filter-group">
                <label>District</label>
                <select id="exam-district-filter">
                    <option value="all">All Districts</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Location Type</label>
                <select id="exam-location-filter">
                    <option value="all">Any Location</option>
                    <option value="Urban">Urban</option>
                    <option value="Rural">Rural</option>
                </select>
            </div>

            <div class="filter-group">
                <label>University Type</label>
                <select id="exam-univ-type-filter">
            <option value="all">All Types</option>
            <option value="Central University">Central</option>
            <option value="State Public University">State Public</option>
            <option value="State Private University">State Private</option>
            <option value="Deemed">Deemed (all)</option>
            <option value="IIT">IIT</option>
            <option value="NIT">NIT</option>
            <option value="IIIT">IIIT</option>
            <option value="IIM">IIM</option>
            <option value="IISER">IISER</option>
            <option value="AIIMS">AIIMS</option>
            <option value="Institute of National Importance">Other Institute of National Importance</option>
            <option value="State Open University">State Open</option>
          </select>
            </div>

            <div class="filter-group">
                <label>College Type</label>
                <select id="exam-coll-type-filter">
            <option value="all">All Types</option>
            <option value="Affiliated">Affiliated</option>
            <option value="Autonomous">Autonomous</option>
            <option value="Constituent">Constituent / University College</option>
            <option value="Recognized">Recognized Center</option>
            <option value="PG Center">PG Center / Off-Campus</option>
          </select>
            </div>

            <div class="filter-group">
                <label>Management (Colleges)</label>
                <select id="exam-management-filter">
            <option value="all">All Management Types</option>
            <option value="Private Un-Aided">Private Un-Aided</option>
            <option value="Private Aided (Government Aided)">Private Aided (Government Aided)</option>
            <option value="State Government">State Government</option>
            <option value="Central Government">Central Government</option>
            <option value="Local Body">Local Body</option>
            <option value="University">University</option>
          </select>
            </div>

            <div class="filter-group">
                <label>Sort By</label>
                <select id="exam-sort-filter">
                    <option value="name_asc">Name (A → Z)</option>
                    <option value="name_desc">Name (Z → A)</option>
                </select>
            </div>

            <button id="apply-exam-filters-btn">Search Institutions</button>
        </aside>

        <!-- Results Display Area -->
        <main class="results-area">
            <div id="exam-results-list">
                <!-- Institution cards will be injected dynamically here -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

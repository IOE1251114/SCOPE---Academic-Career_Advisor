<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scope - Academic & Career Advisor</title>
    <!-- Import Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Updated Header -->
    <header class="main-header">
      <div class="header-content">
        <h1>Scope</h1>
        <p>The Complete Indian Academic & Career Database</p>
      </div>
    </header>

    <main>
      <section id="auth-container">
        <h2>Access the Database</h2>
        <form id="auth-form">
          <input type="email" id="email" placeholder="Enter your email" required />
          <input type="password" id="password" placeholder="Enter your password" required />
          <div class="button-group">
            <button type="submit" id="login-btn">Login</button>
            <button type="button" id="signup-btn">Sign Up</button>
          </div>
          <p id="auth-message"></p>
        </form>
      </section>

      <section id="dashboard-container" style="display: none">
        <div class="dashboard-header">
          <h2>Scope Directory</h2>
          <button id="logout-btn">Logout</button>
        </div>

        <div class="dashboard-layout">
          <!-- Filter Sidebar -->
          <aside class="filter-sidebar">
            <h3>Filters</h3>

            <label for="filter-level">Institution Level</label>
            <select id="filter-level">
              <option value="both">Both Colleges & Universities</option>
              <option value="college">Colleges Only</option>
              <option value="university">Universities Only</option>
            </select>

            <label for="filter-state">State</label>
            <select id="filter-state">
              <option value="">All States</option>
              <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Arunachal Pradesh">Arunachal Pradesh</option>
              <option value="Assam">Assam</option>
              <option value="Bihar">Bihar</option>
              <option value="Chandigarh">Chandigarh</option>
              <option value="Chhattisgarh">Chhattisgarh</option>
              <option value="Dadra and Nagar Haveli">Dadra and Nagar Haveli</option>
              <option value="Daman and Diu">Daman and Diu</option>
              <option value="The Dadra and Nagar Haveli and Daman and Diu">The Dadra and Nagar Haveli and Daman and Diu</option>
              <option value="Delhi">Delhi</option>
              <option value="Goa">Goa</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Haryana">Haryana</option>
              <option value="Himachal Pradesh">Himachal Pradesh</option>
              <option value="Jammu and Kashmir">Jammu and Kashmir</option>
              <option value="Jharkhand">Jharkhand</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Ladakh">Ladakh</option>
              <option value="Lakshadweep">Lakshadweep</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Manipur">Manipur</option>
              <option value="Meghalaya">Meghalaya</option>
              <option value="Mizoram">Mizoram</option>
              <option value="Nagaland">Nagaland</option>
              <option value="Odisha">Odisha</option>
              <option value="Puducherry">Puducherry</option>
              <option value="Punjab">Punjab</option>
              <option value="Rajasthan">Rajasthan</option>
              <option value="Sikkim">Sikkim</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Telangana">Telangana</option>
              <option value="Tripura">Tripura</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Uttarakhand">Uttarakhand</option>
              <option value="West Bengal">West Bengal</option>
            </select>

            <label for="filter-location">Location Type</label>
            <select id="filter-location">
              <option value="">All Locations</option>
              <option value="Urban">Urban</option>
              <option value="Rural">Rural</option>
            </select>

            <label for="filter-univ-type">University Type</label>
            <select id="filter-univ-type">
              <option value="">All Types</option>
              <option value="State Public University">State Public University</option>
              <option value="State Private University">State Private University</option>
              <option value="Central University">Central University</option>
              <option value="Deemed University - Private">Deemed University - Private</option>
              <option value="IIT">IIT</option>
              <option value="NIT">NIT</option>
            </select>

            <label for="filter-coll-type">College Type</label>
            <select id="filter-coll-type">
              <option value="">All Types</option>
              <option value="Affiliated College">Affiliated College</option>
              <option value="Constituent / University College">Constituent / University College</option>
              <option value="Autonomous College">Autonomous College</option>
              <option value="Recognized Center">Recognized Center</option>
            </select>

            <button id="apply-filters-btn">Apply Filters</button>
          </aside>

          <!-- Results Area -->
          <main class="results-area">
            <div id="loading-indicator" style="display: none">
              Loading data...
            </div>
            <div id="college-list"></div>
          </main>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope | Identify Academic and Career Pathways</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">
</head>
<body>
    <header class="header-container">
        <div class="header">
            <div class="top">
                <div class="logo"></div>
            </div>
            <div class="headend">
                <select name="languages" title="Languages">
                    <option value="English">English</option>
                    <option value="French">French</option>
                </select>
                <button id="nav-signin-btn">Sign In</button>
            </div>
        </div>
    </header>

    <section>
        <div class="section">
            Explore <br> various options<br> related to <br> Academics and Career<br>across India with
            <div class="name">SCOPE</div>
        </div>
    </section>

    <main class="main">
        <a href="exam.html" class="card-link">
            <div class="card">
                <div class="upper">
                    <div class="name">Examinations</div>
                    <div class="icon"><img src="images/icon_exam.png" alt="exam"></div>
                </div>
                <div class="bottom">
                    OLYMPIADS • UG EXAMS • PG EXAMS
                </div>
            </div>
        </a>
        <a href="college.html" class="card-link">
            <div class="card">
                <div class="upper">
                    <div class="name">Colleges</div>
                    <div class="icon"><img src="images/college.png" alt="college building"></div>
                </div>
                <div class="bottom">
                    UNIVERSITIES ACROSS INDIA
                </div>
            </div>
        </a>
        <a href="career.html" class="card-link">
            <div class="card">
                <div class="upper">
                    <div class="name">Career</div>
                    <div class="icon"><img src="images/proff.png" alt="professional worker"></div>
                </div>
                <div class="bottom">
                    VARIOUS PROFESSIONS TO OPT FOR
                </div>
            </div>
        </a>
    </main>
    
    <div class="footer"></div>
    <script src="app.js"></script>
</body>
</html>
